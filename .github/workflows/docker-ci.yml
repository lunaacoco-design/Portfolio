name: CI/CD with Docker to Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      label_name:
        description: 'Label to apply to the Docker image (e.g., specific version, "latest")'
        required: true
        default: 'latest'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Use the label_name input if available, otherwise default to 'latest'
          tags: ${{ secrets.DOCKER_USERNAME }}/your-repo-name:${{ github.event.inputs.label_name || 'latest' }}
          file: ./Dockerfile
          cache-from: type=gha # Cache layers for faster builds
          cache-to: type=gha,mode=max # Save cache to GitHub Actions cache